<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Internal dashboard analysing visa and permit outcomes from Princeton in Africa fellowship reports."
    />
    <meta name="theme-color" content="#6B2A20" />

    <!-- Preconnect first so the font request starts during HTML parse rather
         than after the stylesheet is discovered. Both faces fall back to
         system fonts if the network is unavailable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Generated from the PiAf logo by scripts/make_favicon.py. The ICO holds
         16/32/48px variants so the browser picks the right one instead of
         downscaling a large image badly. -->
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Visa Intelligence · Princeton in Africa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
